model_config: config/model/transformer-smoke.yaml

data:
  train_paths:
    - datasets/processed/tokenizer-training/train.txt
  validation_paths:
    - datasets/processed/tokenizer-training/heldout.txt
  validation_fraction: 0.0
  context_length: 16
  append_eos: true

loader:
  batch_size: 2
  num_workers: 0
  shuffle: true
  drop_last: true
  pin_memory: false

optimizer:
  learning_rate: 0.01
  min_learning_rate: 0.001
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  gradient_clip_norm: 1.0

loop:
  seed: 1337
  device: cpu
  deterministic: true
  max_steps: 20
  warmup_steps: 2
  log_interval: 5
  evaluation_interval: 10
  evaluation_batches: 2
  checkpoint_interval: 10

checkpoint:
  directory: checkpoints/smoke
  resume_from: null

logging:
  level: INFO
  format: json
