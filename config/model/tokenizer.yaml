version: 1
vocab_size: 16000
special_tokens:
  - <pad>
  - <bos>
  - <eos>
  - <unk>
  - <user>
  - <assistant>
unk_token: <unk>
normalization: NFC
lowercase: false
pre_tokenizer:
  type: ByteLevel
  add_prefix_space: false
  use_regex: true
min_frequency: 1

corpus_name: gutenberg-moby-dick
corpus_source: https://www.gutenberg.org/ebooks/15
corpus_license: Public domain in the USA; verify status in the deployment jurisdiction.
placeholder_corpus: true
raw_corpus_path: datasets/raw/gutenberg-moby-dick/
raw_file_glob: "*.txt"
corpus_path: datasets/processed/tokenizer-training/
training_file: train.txt
heldout_file: heldout.txt
heldout_fraction: 0.10
manifest_path: datasets/manifests/gutenberg-moby-dick.json

artifacts_path: research/tokenizer/artifacts/
tokenizer_file: tokenizer.json
tokenizer_card_file: tokenizer_card.md
